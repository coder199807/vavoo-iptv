name: Vavoo + eigene Liste aktualisieren (30 Min)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install requests

      - name: Run Vavoo scraper
        run: |
          cd scrapers
          python vavoo.py

      - name: Collect M3U files
        run: |
          mkdir -p playlisten
          cp scrapers/vavoo.m3u playlisten/ 2>/dev/null || true
          cp 7347h6.m3u playlisten/ 2>/dev/null || true
          echo "Dateien:"
          ls -la playlisten/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy playlisten --project-name=a55688dd.7347h6 --commit-dirty=true
