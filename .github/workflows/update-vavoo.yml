name: Update Vavoo M3U
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          mkdir -p dist
          cp iptv.m3u dist/
          if [ -f 7347h6.m3u ]; then cp 7347h6.m3u dist/; fi
          cd dist
          npx wrangler pages deploy . --project-name=7347h6
 --commit-dirty=true
