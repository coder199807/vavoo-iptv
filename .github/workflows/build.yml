name: Build IPTV M3U

on:
  schedule:
    # Every Monday at 03:00 UTC (06:00 TR)
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build.js"
      - ".github/workflows/build.yml"
      - "package.json"

concurrency:
  group: build-m3u
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone iptv-org/epg
        run: |
          if [ ! -d external/epg/.git ]; then
            git clone --depth 1 https://github.com/iptv-org/epg.git external/epg
          fi

      - name: Cache iptv-org/epg node_modules
        uses: actions/cache@v4
        with:
          path: external/epg/node_modules
          key: iptvorg-epg-${{ hashFiles('external/epg/package-lock.json') }}

      - name: Install iptv-org/epg deps
        working-directory: external/epg
        run: npm ci --no-audit --no-progress

      - name: Grab TR EPG (dsmart, turksatkablo)
        working-directory: external/epg
        continue-on-error: true
        timeout-minutes: 20
        # digiturk.com.tr ve tvplus.com.tr GitHub Actions datacenter IP'lerinden
        # erişilemiyor (digiturk: Cloudflare/WAF 403 block; tvplus: Türk Telekom
        # internal backend, port 33207 geo-fenced). turksatkablo.com.tr eksik TLS
        # zinciri gönderdiği için NODE_TLS_REJECT_UNAUTHORIZED=0 gerekli — bu step'e
        # scope'lu, sonraki build step'i normal TLS doğrulaması yapmaya devam eder.
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          npm run grab --- \
            --sites=dsmart.com.tr,turksatkablo.com.tr \
            --lang=tr \
            --maxConnections=5 \
            --output=guides/{site}.xml || true
          ls -la guides/ || true

      - name: Generate iptv.m3u and epg.xml
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
          IPTVORG_GRAB_DIR: external/epg/guides
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain iptv.m3u epg.xml)" ]]; then
            git add iptv.m3u epg.xml
            git commit -m "chore: update iptv.m3u / epg.xml ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in iptv.m3u or epg.xml"
          fi
name: Build and Deploy Playlists

on:
  schedule:
    - cron: '*/15 * * * *'    # alle 15 Minuten
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --- Vorhandene Schritte aus der originalen build.yml ---
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt
          # falls es ein globales requirements gibt, das auch installieren
          if [ -f ../requirements.txt ]; then pip install -r ../requirements.txt; fi

      - name: Run scrapers
        run: |
          cd scripts
          python oha.py
          python huhu.py
          python kool.py
          # Vavoo-Scraper liegt vielleicht im Hauptverzeichnis
          if [ -f ../vavoo.py ]; then python ../vavoo.py; fi

      # --- NEU: Playlists in einen gemeinsamen Ordner kopieren ---
      - name: Collect all M3U files
        run: |
          mkdir -p playlisten
          # Kopiere alle .m3u aus dem scripts-Ordner
          cp scripts/*.m3u playlisten/ 2>/dev/null || true
          # Falls vavoo.m3u im Hauptverzeichnis liegt
          cp vavoo.m3u playlisten/ 2>/dev/null || true
          # Eigene statische Liste (falls im Repo vorhanden)
          cp 7347h6.m3u playlisten/ 2>/dev/null || true
          # Zeige an, welche Dateien gesammelt wurden
          echo "Gefundene Playlisten:"
          ls -la playlisten/

      # --- NEU: Deployment zu Cloudflare Pages ---
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy playlisten --project-name=iptv-playlists --commit-dirty=true
